perception:
  ros__parameters:
    color_topic: /camera/color/image_raw
    depth_topic: /camera/aligned_depth_to_color/image_raw
    info_topic: /camera/color/camera_info
    odom_frame: odom
    base_frame: base_link
    grasp_frame: link_grasp_center
    max_rate: 5.0              # cuadros por segundo que se procesan
    cloud_rate: 2.0            # nube 3D publicada por segundo
    cloud_stride: 3            # 1 de cada 3 píxeles en la nube
    rotate_debug_image: true   # la cámara de la cabeza va girada 90°: se endereza para verla
    board:
      history: 30
      # Si la base patina, el pizarrón se recoloca con lo visto en los últimos fresh_age s, solo si
      # son fresh_min_markers ArUco o más (corrección en x, y y giro sobre el piso)
      fresh_age: 2.0
      fresh_min_markers: 2
    brush:
      tip_beyond_body: 0.017   # de donde acaba el cuerpo verde a la punta (m)
      body_radius: 0.011
