# Perfil de un niño. La terapeuta ajusta estos valores; se hace una copia por niño.
scanning_menu:
  ros__parameters:
    user_id: nino_01
    mode: figuras            # figuras (trazos preestablecidos) | libre (líneas continuas)
    level: 3                 # peldaño: 1 causa-efecto, 2 elegir color, 3 componer, 4 copiar un diseño
    input: auto              # auto = un switch con barrido automático | pasos = dos switches (avanzar / elegir)
    scan_interval: 1.5       # segundos por opción
    first_item_delay: 1.5    # la primera opción dura 1.5 veces más (da tiempo de prepararse)
    max_cycles: 4            # vueltas sin elegir antes de pausar el barrido
    free_activation: toggle  # trazo libre: toggle (presiona para empezar y para parar) | hold (pinta mientras lo sostiene)
    colors: [rojo, amarillo, azul]
    shapes: [linea, ola, circulo, zigzag, puntos, sol]
    template: ['sol:amarillo:0:0', 'ola:azul:2:1', 'circulo:rojo:1:3']   # solo peldaño 4: fila:columna desde arriba-izquierda
    voice: false             # barrido auditivo con spd-say (útil con baja visión)

switch_filter:
  ros__parameters:
    acceptance_time: 0.10        # la presión debe durar al menos esto para contar (s)
    post_acceptance_delay: 0.30  # tras una presión aceptada, ignorar las siguientes durante esto (s)
    joy_buttons: [0, 1]          # botones del joystick/interfaz USB para el switch 1 y el 2

decision_logger:
  ros__parameters:
    user_id: nino_01
